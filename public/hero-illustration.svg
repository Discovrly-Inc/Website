<svg viewBox="0 0 980 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pathIn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="pathOut" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="cardShadow" x="-6%" y="-10%" width="112%" height="128%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="hubShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="460" rx="24" fill="#fafbfc"/>
  <rect x="1" y="1" width="978" height="458" rx="23" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Central glow -->
  <circle cx="490" cy="230" r="200" fill="url(#hubGlow)"/>

  <!-- LABEL: Your tools -->
  <text x="120" y="30" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8" font-family="system-ui" letter-spacing="0.08em">YOUR TOOLS</text>

  <!-- SOURCE CARDS (left) -->

  <!-- Slack -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="46" width="192" height="62" rx="14" fill="white"/>
    <rect x="24" y="46" width="192" height="62" rx="14" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <image href="/integrations/slack-new-logo.svg" x="40" y="60" width="32" height="32"/>
    <text x="84" y="73" font-size="13" font-weight="600" fill="#0f172a" font-family="system-ui">Slack</text>
    <text x="84" y="90" font-size="10" fill="#94a3b8" font-family="system-ui">Messages &amp; threads</text>
  </g>

  <!-- Notion -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="126" width="192" height="62" rx="14" fill="white"/>
    <rect x="24" y="126" width="192" height="62" rx="14" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <image href="/integrations/notion-icon.svg" x="40" y="140" width="32" height="32"/>
    <text x="84" y="153" font-size="13" font-weight="600" fill="#0f172a" font-family="system-ui">Notion</text>
    <text x="84" y="170" font-size="10" fill="#94a3b8" font-family="system-ui">Docs &amp; wikis</text>
  </g>

  <!-- Zoom -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="206" width="192" height="62" rx="14" fill="white"/>
    <rect x="24" y="206" width="192" height="62" rx="14" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <image href="/integrations/zoom-communications-logo.svg" x="40" y="220" width="32" height="32"/>
    <text x="84" y="233" font-size="13" font-weight="600" fill="#0f172a" font-family="system-ui">Zoom</text>
    <text x="84" y="250" font-size="10" fill="#94a3b8" font-family="system-ui">Call recordings</text>
  </g>

  <!-- Jira -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="286" width="192" height="62" rx="14" fill="white"/>
    <rect x="24" y="286" width="192" height="62" rx="14" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <image href="/integrations/jira-icon.svg" x="40" y="300" width="32" height="32"/>
    <text x="84" y="313" font-size="13" font-weight="600" fill="#0f172a" font-family="system-ui">Jira</text>
    <text x="84" y="330" font-size="10" fill="#94a3b8" font-family="system-ui">Issues &amp; boards</text>
  </g>

  <!-- Salesforce -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="366" width="192" height="62" rx="14" fill="white"/>
    <rect x="24" y="366" width="192" height="62" rx="14" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <image href="/integrations/salesforce-2.svg" x="40" y="380" width="32" height="32"/>
    <text x="84" y="393" font-size="13" font-weight="600" fill="#0f172a" font-family="system-ui">Salesforce</text>
    <text x="84" y="410" font-size="10" fill="#94a3b8" font-family="system-ui">Customer data</text>
  </g>

  <!-- INPUT FLOW PATHS -->
  <path d="M216 77 C300 77, 340 190, 410 210" stroke="url(#pathIn)" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
  <path d="M216 157 C300 157, 350 205, 410 220" stroke="url(#pathIn)" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
  <path d="M216 237 C300 237, 350 232, 410 232" stroke="url(#pathIn)" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
  <path d="M216 317 C300 317, 350 255, 410 245" stroke="url(#pathIn)" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
  <path d="M216 397 C300 397, 340 265, 410 255" stroke="url(#pathIn)" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>

  <!-- DISCOVRLY HUB (center) -->
  <g filter="url(#hubShadow)">
    <rect x="410" y="155" width="170" height="150" rx="22" fill="#059669"/>
  </g>
  <circle cx="495" cy="200" r="18" fill="white" opacity="0.15"/>
  <text x="495" y="206" text-anchor="middle" font-size="20" fill="white" font-family="system-ui">⚡</text>
  <text x="495" y="244" text-anchor="middle" font-size="19" font-weight="700" fill="white" font-family="system-ui" letter-spacing="-0.02em">Discovrly</text>
  <rect x="422" y="167" width="146" height="126" rx="14" fill="none" stroke="white" stroke-width="0.5" opacity="0.2"/>

  <!-- OUTPUT FLOW PATHS -->
  <path d="M580 200 C640 200, 660 120, 720 120" stroke="#34d399" stroke-width="2" fill="none"/>
  <path d="M580 235 L720 235" stroke="#34d399" stroke-width="2" fill="none"/>
  <path d="M580 260 C640 260, 660 348, 720 348" stroke="#34d399" stroke-width="2" fill="none"/>
  <!-- Arrow heads -->
  <path d="M718 116l6 4-6 4" stroke="#34d399" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M718 231l6 4-6 4" stroke="#34d399" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M718 344l6 4-6 4" stroke="#34d399" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- LABEL: Outputs -->
  <text x="840" y="30" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8" font-family="system-ui" letter-spacing="0.08em">OUTPUTS</text>

  <!-- OUTPUT CARDS (right) -->

  <!-- Insights -->
  <g filter="url(#cardShadow)">
    <rect x="726" y="85" width="230" height="76" rx="16" fill="white"/>
    <rect x="726" y="85" width="230" height="76" rx="16" fill="none" stroke="#a7f3d0" stroke-width="1"/>
    <rect x="746" y="101" width="38" height="38" rx="10" fill="#d1fae5"/>
    <!-- Lightbulb icon -->
    <path d="M765 108 c-4 0-7 3-7 7 0 2.5 1.2 4.7 3 6v3h8v-3c1.8-1.3 3-3.5 3-6 0-4-3-7-7-7z" stroke="#059669" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M761 124h8" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M762.5 127h5" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
    <text x="800" y="113" font-size="14" font-weight="600" fill="#0f172a" font-family="system-ui">Insights &amp; Themes</text>
    <text x="800" y="128" font-size="10" fill="#94a3b8" font-family="system-ui">Auto-synthesized</text>
    <text x="800" y="141" font-size="10" fill="#94a3b8" font-family="system-ui">from research</text>
  </g>

  <!-- PRDs -->
  <g filter="url(#cardShadow)">
    <rect x="726" y="200" width="230" height="70" rx="16" fill="white"/>
    <rect x="726" y="200" width="230" height="70" rx="16" fill="none" stroke="#a7f3d0" stroke-width="1"/>
    <rect x="746" y="216" width="38" height="38" rx="10" fill="#bbf7d0"/>
    <!-- Document icon -->
    <rect x="757" y="222" width="16" height="20" rx="2" stroke="#059669" stroke-width="1.5" fill="none"/>
    <path d="M760 228h10M760 232h10M760 236h7" stroke="#059669" stroke-width="1.2" stroke-linecap="round"/>
    <text x="800" y="230" font-size="14" font-weight="600" fill="#0f172a" font-family="system-ui">PRDs &amp; Stories</text>
    <text x="800" y="248" font-size="10" fill="#94a3b8" font-family="system-ui">Generated with full context</text>
  </g>

  <!-- Tickets -->
  <g filter="url(#cardShadow)">
    <rect x="726" y="315" width="230" height="70" rx="16" fill="white"/>
    <rect x="726" y="315" width="230" height="70" rx="16" fill="none" stroke="#a7f3d0" stroke-width="1"/>
    <rect x="746" y="331" width="38" height="38" rx="10" fill="#a7f3d0"/>
    <!-- Checklist / ticket icon -->
    <rect x="757" y="337" width="16" height="20" rx="2" stroke="#059669" stroke-width="1.5" fill="none"/>
    <path d="M760 343l2 2 4-4" stroke="#059669" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M760 350h7M760 354h5" stroke="#059669" stroke-width="1.2" stroke-linecap="round"/>
    <text x="800" y="345" font-size="14" font-weight="600" fill="#0f172a" font-family="system-ui">Jira &amp; Linear Tickets</text>
    <text x="800" y="363" font-size="10" fill="#94a3b8" font-family="system-ui">Ready to assign &amp; ship</text>
  </g>
</svg>
